name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  token-efficiency-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        working-directory: plugins/token-efficiency-routing
        run: python3 -m py_compile scripts/*.py tests/*.py
      - name: Hook tests
        working-directory: plugins/token-efficiency-routing
        run: python3 -B tests/test_hooks.py

  token-meter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.332
      - name: Validate plugins
        run: |
          claude plugin validate plugins/token-meter
          claude plugin validate plugins/token-efficiency-routing
      - name: Plugin tests
        working-directory: plugins/token-meter
        run: claude plugin test .
